<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0605">
<title>솔로 할로윈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200..800&family=Gowun+Batang:wght@400;700&family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --night:#0b0605; --wood:#1a0f0a; --wood2:#24150d; --glass:rgba(24,12,8,.78);
    --amber:#f2a541; --gold:#ffcf7a; --blood:#b3121f; --blood-d:#6e0a12; --wine:#8a1420;
    --bone:#fff6ea; --muted:rgba(255,236,214,.64); --faint:rgba(255,236,214,.16);
    --teal:#3fb8a8; --pump:#f07a1a; --violet:#7b4fb0;
    --kr:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    --round:"Hahmlet","Noto Serif KR",serif;
    --heavy:"Hahmlet","Noto Serif KR",serif;
    --story:"Gowun Batang","Hahmlet",serif;
    --serif:"Cinzel","Times New Roman",serif;
    --script:"Cormorant Garamond",Georgia,serif;
    --goldtxt:linear-gradient(180deg,#fff4dc 0%,#f6d08a 42%,#c98d3a 78%,#8c5a1f 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--night);color:var(--bone);font-family:var(--kr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;color:inherit}
  input,textarea{font-family:var(--kr)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ── 배경: 성당 스테인드글라스 ── */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(60% 34% at 28% 22%,rgba(242,165,65,.42),transparent 70%),
      radial-gradient(50% 30% at 76% 20%,rgba(179,18,31,.32),transparent 70%),
      linear-gradient(180deg,#2a1408 0%,#140a06 48%,#0b0605 100%)}
  #bg .photo{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1.2s}
  #bg .photo.ok{opacity:.9}
  #bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,6,5,.15) 0%,rgba(11,6,5,.35) 40%,rgba(11,6,5,.88) 100%)}
  #bg .ray{position:absolute;top:-10%;left:20%;width:46%;height:130%;transform:rotate(-24deg);
    background:linear-gradient(90deg,transparent,rgba(255,200,110,.14),transparent);filter:blur(8px);animation:ray 9s ease-in-out infinite}
  #bg .ray.r2{left:50%;width:22%;animation-delay:-4s;opacity:.7}
  @keyframes ray{0%,100%{opacity:.45}50%{opacity:1}}
  .dust{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,215,150,.75);box-shadow:0 0 6px rgba(255,200,120,.8);animation:dust linear infinite}
  @keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(40px,-60vh);opacity:0}}

  .screen{position:relative;z-index:1;min-height:100%;min-height:100dvh}

  /* ── 포스터 타이포 ── */
  .poster{font-family:var(--heavy);font-weight:300;letter-spacing:.04em;background:var(--goldtxt);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(242,165,65,.28)) drop-shadow(0 2px 1px rgba(0,0,0,.6))}
  .script{font-family:var(--script);font-style:italic;font-weight:500;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 14px rgba(242,165,65,.35)}
  .redtxt{font-family:var(--round);font-weight:500;letter-spacing:.02em;background:linear-gradient(180deg,#ffd9dc,#ff5b66 55%,#a3101c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,60,70,.35))}
  .whitetxt{font-family:var(--round);font-weight:400;color:#f7ead6;letter-spacing:.02em;text-shadow:0 0 18px rgba(0,0,0,.8),0 1px 2px rgba(0,0,0,.9)}
  .orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:9px;opacity:.85}
  .orn::before,.orn::after{content:"";height:1px;width:min(22vw,90px);background:linear-gradient(90deg,transparent,rgba(246,208,138,.75))}
  .orn::after{transform:scaleX(-1)}
  .serif{font-family:var(--serif)}

  /* ── 로그인 ── */
  #login{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px calc(30px + env(safe-area-inset-bottom));text-align:center}
  .lg-eyebrow{font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:var(--gold);margin:0 0 6px;padding-left:.42em;text-transform:uppercase;opacity:.9}
  .lg-en{font-family:var(--script);font-style:italic;font-size:clamp(20px,6vw,28px);color:#f3dcb0;margin:16px 0 0;letter-spacing:.02em;opacity:.9}
  .lg-title{font-size:clamp(56px,17vw,100px);line-height:1.1;margin:0;font-weight:200;letter-spacing:.06em;padding-left:.06em;white-space:nowrap}
  .lg-quote{font-family:var(--story);font-size:clamp(14px,4vw,17px);margin:10px 0 34px;color:#e9d6bd;letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .lg-quote em{font-style:normal;color:#9fe3d8;text-shadow:0 0 12px rgba(63,184,168,.55)}
  .arch{position:relative;width:100%;max-width:380px;padding:50px 30px 26px;border-radius:190px 190px 6px 6px;
    background:linear-gradient(180deg,rgba(28,14,9,.6),rgba(10,5,4,.88));border:1px solid rgba(246,208,138,.38);
    box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 0 60px rgba(242,165,65,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .arch::before{content:"";position:absolute;inset:7px;border-radius:184px 184px 3px 3px;border:1px solid rgba(246,208,138,.14);pointer-events:none}
  .arch .sigil{position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#140906;border:1px solid rgba(246,208,138,.55);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(242,165,65,.35)}
  .arch .sigil svg{width:16px;height:16px}
  .lf{display:block;text-align:center;margin:0 0 26px}
  .lf>span{display:block;font-family:var(--serif);font-size:10.5px;letter-spacing:.38em;padding-left:.38em;color:var(--gold);margin-bottom:4px}
  .lf>span i{display:block;font-style:normal;font-family:var(--story);letter-spacing:.1em;padding:0;color:var(--muted);font-size:11.5px;margin-top:3px}
  .lf input{width:100%;height:48px;border:0;border-bottom:1px solid rgba(246,208,138,.32);background:transparent;color:#fff4e2;text-align:center;
    font-family:var(--story);font-size:20px;letter-spacing:.12em;border-radius:0;transition:border-color .3s,box-shadow .3s}
  .lf input::placeholder{color:rgba(246,208,138,.24);letter-spacing:.3em;font-size:15px}
  .lf input:focus{outline:none;border-bottom-color:var(--gold);box-shadow:0 14px 18px -16px rgba(246,208,138,.75)}
  .enter{position:relative;overflow:hidden;width:100%;min-height:60px;margin-top:4px;border:1px solid rgba(246,208,138,.6);border-radius:3px;cursor:pointer;
    background:linear-gradient(180deg,#5d0b14,#2a0408);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    box-shadow:inset 0 0 0 3px rgba(10,3,3,.65),inset 0 0 0 4px rgba(246,208,138,.22),0 12px 30px rgba(110,10,18,.45);transition:transform .15s}
  .enter b{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.46em;padding-left:.46em;background:var(--goldtxt);-webkit-background-clip:text;background-clip:text;color:transparent}
  .enter small{font-family:var(--story);font-size:12px;letter-spacing:.24em;padding-left:.24em;color:rgba(246,208,138,.75)}
  .enter::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,226,170,.2),transparent);animation:sweep 3.6s ease-in-out infinite}
  @keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
  .enter:active{transform:scale(.985)}
  .enter:disabled{opacity:.6}
  .card{width:100%;max-width:400px;background:var(--glass);border:1px solid rgba(255,207,122,.28);border-radius:20px;padding:20px 18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,160,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .fld{display:block;text-align:left;margin-bottom:12px}
  .fld>span{display:block;font-family:var(--round);font-size:13px;font-weight:600;color:var(--gold);margin-bottom:6px;letter-spacing:.06em}
  .fld>span i{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
  .inp{width:100%;min-height:50px;border-radius:6px;font-family:var(--story);border:1px solid rgba(255,207,122,.3);background:rgba(10,5,4,.7);color:var(--bone);padding:12px 14px;font-size:16px}
  .inp::placeholder{color:rgba(255,236,214,.3)}
  .inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,165,65,.18)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:4px;cursor:pointer;
    background:linear-gradient(180deg,#6a0c16,#30050a);color:#f6d9a8;font-family:var(--round);font-weight:500;font-size:16px;letter-spacing:.08em;
    border:1px solid rgba(246,208,138,.5);box-shadow:inset 0 0 0 3px rgba(10,3,3,.55),inset 0 0 0 4px rgba(246,208,138,.16),0 10px 24px rgba(110,10,18,.4);transition:transform .12s}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.gold{background:linear-gradient(180deg,#f3d08c,#b47a2c);color:#2a1204;font-weight:600;border-color:#ffe2a8;box-shadow:inset 0 0 0 3px rgba(255,240,210,.25),0 10px 24px rgba(242,165,65,.25)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,207,122,.35);box-shadow:none;color:var(--bone);font-family:var(--kr);font-size:15px;font-weight:700}
  .btn.small{min-height:42px;font-size:15px;border-radius:11px}
  .err{min-height:20px;margin:12px 0 0;font-size:13px;color:#ffa0a6;line-height:1.65;font-family:var(--story)}
  .lg-foot{margin-top:22px;font-family:var(--story);font-size:12px;color:rgba(255,236,214,.46);line-height:1.8;letter-spacing:.04em}

  /* ── 인트로 ── */
  #intro{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden}
  #gate{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;
    background:radial-gradient(40% 30% at 50% 55%,rgba(242,140,40,.22),transparent 70%),#050202}
  #gate p{font-family:var(--story);letter-spacing:.14em;font-size:17px;color:var(--gold);margin:0;animation:breathe 2.2s ease-in-out infinite}
  #gate small{font-size:12px;color:var(--muted)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  .candle{position:relative;width:46px;height:120px}
  .candle .wax{position:absolute;bottom:0;left:6px;width:34px;height:84px;border-radius:6px 6px 4px 4px;background:linear-gradient(90deg,#e9dcc4,#fff6e6 45%,#cbb994)}
  .candle .wick{position:absolute;bottom:84px;left:22px;width:2px;height:9px;background:#2a1a10}
  .candle .flame{position:absolute;bottom:90px;left:12px;width:22px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 70%,#fff 0 18%,#ffd36b 35%,#ff8a1a 70%,transparent 72%);filter:blur(.4px);
    transform-origin:50% 100%;animation:flame 1.1s ease-in-out infinite alternate;box-shadow:0 0 40px 14px rgba(255,150,40,.35)}
  @keyframes flame{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
  #gate.off .flame{animation:none;opacity:0;transition:opacity .3s}
  #vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;transition:opacity .8s}
  #vid.on{opacity:1}
  #intro .vshade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7));pointer-events:none}
  .ov-line{position:absolute;left:0;right:0;padding:0 22px;text-align:center;font-family:var(--round);opacity:0;pointer-events:none}
  .ov-line{font-family:var(--story)!important;letter-spacing:.08em;text-shadow:0 0 16px #000,0 0 4px #000,0 1px 2px #000}
  .ov-line.l1{top:22%;font-size:21px;color:#fff4e2}
  .ov-line.l2{top:30%;font-size:17px;color:#f3cf92}
  .ov-line.show{animation:lineIn 2.4s ease forwards}
  @keyframes lineIn{0%{opacity:0;filter:blur(8px);transform:translateY(10px) scale(.98)}
    18%{opacity:1;filter:blur(0);transform:none}
    22%{opacity:.4}26%{opacity:1}82%{opacity:1}100%{opacity:0;filter:blur(4px)}}
  .ov-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;padding:0 16px}
  .ov-title.show{animation:titleIn 3.2s ease forwards}
  .ov-title .script{font-size:30px;margin-bottom:6px}
  .ov-title .poster{font-size:clamp(64px,20vw,120px);line-height:1.08;font-weight:200;letter-spacing:.06em}
  .ov-title .whitetxt{font-family:var(--story);font-size:clamp(14px,4vw,17px);margin-top:16px;letter-spacing:.08em}
  @keyframes titleIn{0%{opacity:0;transform:scale(1.35);filter:blur(10px)}14%{opacity:1;transform:scale(1);filter:blur(0)}
    16%{transform:translateX(-4px)}18%{transform:translateX(4px)}20%{transform:none}86%{opacity:1}100%{opacity:0;transform:scale(.96)}}
  .glitch{animation:glitch .5s steps(2) 3}
  @keyframes glitch{0%{filter:none}50%{filter:hue-rotate(-30deg) contrast(1.6) brightness(1.3)}100%{filter:none}}
  #skipIntro{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5;min-height:36px;padding:0 14px;border-radius:99px;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .bats-burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bb{position:absolute;width:40px;height:22px;left:50%;top:55%;animation:bb 1.4s cubic-bezier(.2,.7,.3,1) forwards}
  .bb svg{width:100%;height:100%;animation:flap .16s linear infinite alternate}
  @keyframes bb{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(var(--s));opacity:0}}
  @keyframes flap{0%{transform:scaleY(1)}100%{transform:scaleY(.4)}}

  /* ── 비주얼노벨 ── */
  #vn{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow:hidden}
  #vn .vnbg{position:absolute;inset:0;background:rgba(5,2,2,.35)}
  #vnStage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;min-height:0}
  #vnStage .spot{position:absolute;bottom:-40px;left:50%;width:280px;height:80px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,190,100,.38),transparent 70%);filter:blur(4px)}
  .ch{position:relative;width:min(62vw,260px);height:min(62vw,260px);will-change:transform}
  .ch svg{width:100%;height:100%;overflow:visible;display:block}
  #vnBox{position:relative;margin:0 12px calc(12px + env(safe-area-inset-bottom));min-height:190px;background:linear-gradient(180deg,rgba(28,12,8,.94),rgba(14,6,4,.97));
    border:1px solid rgba(246,208,138,.4);border-radius:6px;padding:30px 20px 20px;box-shadow:0 0 0 4px rgba(0,0,0,.5),0 -10px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(255,170,60,.06);cursor:pointer}
  #vnBox::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,207,122,.14);border-radius:3px;pointer-events:none}
  #vnName{position:absolute;top:-18px;left:16px;padding:6px 18px 7px;border-radius:3px;font-family:var(--round);font-weight:600;letter-spacing:.12em;font-size:15px;color:#fff1d6;
    background:var(--blood);border:1px solid rgba(246,208,138,.7);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.5)}
  #vnText{font-family:var(--story);font-size:clamp(16px,4.5vw,18.5px);line-height:1.75;letter-spacing:.01em;color:#fff6ea;min-height:64px;word-break:keep-all}
  #vnText b{color:var(--gold);font-weight:700}
  #vnText em{font-style:normal;color:#ff6b74}
  #vnNext{position:absolute;right:16px;bottom:10px;color:var(--gold);font-size:14px;animation:nextb .8s ease-in-out infinite alternate}
  @keyframes nextb{0%{transform:translateY(0)}100%{transform:translateY(5px)}}
  #vnSkip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;min-height:34px;padding:0 13px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
  #vnMute{position:absolute;top:calc(12px + env(safe-area-inset-top));right:118px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:14px;cursor:pointer}
  #vnProg{position:absolute;top:calc(27px + env(safe-area-inset-top));left:14px;right:166px;z-index:3;display:flex;gap:3px}
  #vnProg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
  #vnProg i.on{background:var(--gold)}
  .vnform{cursor:default}
  .vnform .fld{margin-bottom:10px}
  .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .av{aspect-ratio:1;border-radius:14px;border:2px solid rgba(255,207,122,.18);background:rgba(255,255,255,.05);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .av[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,165,65,.2);transform:scale(1.07)}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin:4px 0 10px}

  /* ── 캐릭터 공통 애니메이션 ── */
  .ch .inner{width:100%;height:100%;transform-origin:50% 100%}
  .enter-drop .inner{animation:dropIn .9s cubic-bezier(.3,.7,.4,1) both}
  @keyframes dropIn{0%{transform:translateY(-110vh) scale(.9,1.1)}55%{transform:translateY(0) scale(1.18,.78)}70%{transform:translateY(-22px) scale(.94,1.08)}85%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
  .enter-flutter .inner{animation:flutterIn 1.1s ease-out both}
  @keyframes flutterIn{0%{transform:translate(70vw,-40vh) scale(.4)}25%{transform:translate(30vw,-10vh) scale(.6) rotate(10deg)}50%{transform:translate(-14vw,-26vh) scale(.8) rotate(-12deg)}75%{transform:translate(8vw,-4vh) scale(.95) rotate(6deg)}100%{transform:none}}
  .enter-swirl .inner{animation:swirlIn 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes swirlIn{0%{transform:perspective(600px) rotateY(90deg) scale(.3);filter:brightness(0) blur(6px);opacity:0}40%{opacity:1;filter:brightness(.2) blur(2px)}70%{transform:perspective(600px) rotateY(-14deg) scale(1.04);filter:none}100%{transform:none}}
  .enter-fade .inner{animation:ghostIn 1.5s ease-out both}
  @keyframes ghostIn{0%{opacity:0;transform:translateY(40px) scale(.85);filter:blur(10px)}40%{opacity:.4}60%{opacity:.15}80%{opacity:.9;filter:blur(0)}100%{opacity:1;transform:none}}
  .enter-fly .inner{animation:flyIn 1.2s cubic-bezier(.25,.7,.3,1) both}
  @keyframes flyIn{0%{transform:translate(-90vw,-50vh) rotate(-28deg) scale(.6)}60%{transform:translate(6vw,4vh) rotate(8deg) scale(1.02)}100%{transform:none}}
  .exit .inner{animation:chOut .35s ease-in both}
  @keyframes chOut{to{opacity:0;transform:translateY(30px) scale(.8)}}
  .ch .idle{width:100%;height:100%}
  /* 잭: 통통 튀는 바운스 */
  .ch-jack .idle{transform-origin:50% 100%;animation:jackIdle 1.4s ease-in-out infinite}
  @keyframes jackIdle{0%,100%{transform:scale(1,1)}45%{transform:translateY(-10px) scale(.97,1.04)}55%{transform:translateY(-10px) scale(.97,1.04)}90%{transform:scale(1.05,.95)}}
  .ch-jack .lit{animation:litFlick 2.6s infinite}
  @keyframes litFlick{0%,100%{fill:#ffd25e}40%{fill:#ffbc3a}42%{fill:#fff0a0}44%{fill:#ffc94a}}

<div id="bg"><div class="photo" id="bgPhoto"></div><div class="ray"></div><div class="ray r2"></div><div class="shade"></div></div>

<!-- ① 로그인 -->

</section>

<!-- ② 인트로 (첫 로그인만) -->

function sha256(ascii){
  ascii=unescape(encodeURIComponent(ascii));
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)), maxWord=Math.pow(2,32);
  let result='', words=[], bitLen=ascii.length*8, hash=[], k=[], pc=0, isC={};
  for(let c=2;pc<64;c++){ if(!isC[c]){ for(let i=0;i<313;i+=c) isC[i]=c;
    hash[pc]=(Math.pow(c,.5)*maxWord)|0; k[pc++]=(Math.pow(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(let i=0;i<ascii.length;i++){ words[i>>2]|=ascii.charCodeAt(i)<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=bitLen;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}

}

const Store={
  data:{}, remote:!!CONFIG.DB_URL, timer:0, listeners:[],
  base(){ return CONFIG.DB_URL.replace(/\/+$/,'')+'/'+encodeURIComponent(CONFIG.EVENT); },
  async pull(){
    try{
      if(this.remote){
        const r=await fetch(this.base()+'.json',{cache:'no-store'});
        if(!r.ok) throw new Error(r.status);
        this.data=(await r.json())||{};
      }else this.data=LS.get(K('db'),{});
    }catch(e){ console.warn('sync fail',e); }
    this.listeners.forEach(f=>f());
    return this.data;
  },
  get(path){ return path.split('/').reduce((o,k)=>o&&o[k],this.data); },
  async put(path,val){
    const ks=path.split('/'); let o=this.data;
    for(let i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]&&typeof o[ks[i]]==='object'?o[ks[i]]:{}; o=o[ks[i]]; }
    if(val==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=val;
    if(this.remote){
      try{
        const r=await fetch(this.base()+'/'+ks.map(encodeURIComponent).join('/')+'.json',
          {method:val==null?'DELETE':'PUT',body:val==null?undefined:JSON.stringify(val)});
        if(!r.ok) throw new Error(r.status);
      }catch(e){ toast('🦇 연결이 불안정해요. 잠시 후 다시 시도해 주세요'); throw e; }
    }else LS.set(K('db'),this.data);
    this.notify();
  },
  // 원격: Firebase 실시간 스트림(EventSource)으로 바뀐 부분만 받음. 로컬: 2.5초마다 읽기
  start(){
    clearInterval(this.timer);
    if(this.remote&&window.EventSource){
      if(!this.es){
        const es=new EventSource(this.base()+'.json'); this.es=es;
        const on=(e,patch)=>{ try{ const m=JSON.parse(e.data); if(m) this.apply(m.path,m.data,patch); }catch(_){} this.notify(); };
        es.addEventListener('put',e=>on(e,false)); es.addEventListener('patch',e=>on(e,true));
      }
      this.timer=setInterval(()=>{ if(!document.hidden&&this.es.readyState!==1) this.pull(); },20000);
    }else this.timer=setInterval(()=>{ if(!document.hidden) this.pull(); },this.remote?5000:2500);
  },
  apply(path,data,patch){
    const ks=path.split('/').filter(Boolean);
    if(!ks.length){ if(patch) Object.entries(data||{}).forEach(([k,v])=>{ if(v==null) delete this.data[k]; else this.data[k]=v; }); else this.data=data||{}; return; }
    let o=this.data;
    for(let i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]&&typeof o[ks[i]]==='object'?o[ks[i]]:{}; o=o[ks[i]]; }
    const last=ks[ks.length-1];
    if(patch){ o[last]=o[last]&&typeof o[last]==='object'?o[last]:{}; Object.entries(data||{}).forEach(([k,v])=>{ if(v==null) delete o[last][k]; else o[last][k]=v; }); }
    else if(data==null) delete o[last]; else o[last]=data;
  },
  notify(){ clearTimeout(this.nt); this.nt=setTimeout(()=>this.listeners.forEach(f=>f()),120); }
};
window.addEventListener('storage',e=>{ if(e.key===K('db')) Store.pull(); });

function playIntro(){
  show('intro');
  const v=$('vid'), gate=$('gate');
  gate.hidden=false; gate.classList.remove('off'); v.classList.remove('on');
  let done=false;
  const finish=()=>{ if(done) return; done=true; try{v.pause();}catch(e){} $('skipIntro').hidden=true;
    $('intro').animate([{opacity:1},{opacity:0}],{duration:600}).onfinish=()=>{ $('intro').hidden=true; startVN(); }; };
  $('skipIntro').onclick=()=>{ Voice.init(); finish(); };
  gate.onclick=async()=>{
    Voice.init();
    gate.onclick=null; gate.classList.add('off'); await sleep(350); gate.hidden=true; $('skipIntro').hidden=false;
    let ok=false;
    const srcs=[].concat(CONFIG.INTRO_VIDEO||[]).filter(Boolean);
    if(srcs.length){
      v.innerHTML=srcs.map(u=>'<source src="'+esc(u)+'" type="video/mp4">').join(''); v.load(); v.muted=false;
      // 영상을 못 불러오면 play()가 끝나지 않을 수 있어 3초 제한을 둠
      // 마지막 소스까지 실패하면 바로 넘어감
      const allFail=new Promise(res=>{ const last=v.querySelector('source:last-of-type'); if(last) last.addEventListener('error',()=>res(false),{once:true}); });
      const tryPlay=()=>Promise.race([v.play().then(()=>true),allFail,sleep(3000).then(()=>{ throw new Error('timeout'); })]);
      try{ ok=await tryPlay(); }catch(e){ if(e.message!=='timeout'){ try{ v.muted=true; ok=await tryPlay(); }catch(_){} } }
      if(ok) v.classList.add('on'); else { try{ v.pause(); }catch(_){} }
    }
    const lines=[[300,'l1','쉿… 방금, 문이 열렸어.'],[2500,'l2','혼자 온 영혼의 냄새가 나는데?'],[4700,'l1','오늘 밤은 아무도 혼자 돌아가지 않아.']];
    lines.forEach(([t,c,txt])=>setTimeout(()=>{ if(done) return; const el=$('o'+c); el.textContent=txt; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); },t));
    setTimeout(()=>{ if(!done) batBurst(); },3800);
    const titleAt=ok&&v.duration?Math.max(5600,(v.duration-3)*1000):6200;
    setTimeout(()=>{ if(done) return; const t=$('otitle'); t.classList.add('show'); $('intro').classList.add('glitch'); setTimeout(()=>$('intro').classList.remove('glitch'),1600); },titleAt);
    setTimeout(finish,titleAt+3300);
  };
}
function batBurst(){
  const box=$('bats'); box.innerHTML='';
  for(let i=0;i<22;i++){
    const b=document.createElement('div'); b.className='bb';
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*60;
    b.style.setProperty('--tx',(Math.cos(ang)*dist)+'vw'); b.style.setProperty('--ty',(Math.sin(ang)*dist)+'vh'); b.style.setProperty('--s',1+Math.random()*2.5);

function sliceHTML(html,n){
  let out='',cnt=0,open=[];
  const re=/(<[^>]+>)|([^<])/g; let m;
  while((m=re.exec(html))&&cnt<n){
    if(m[1]){ out+=m[1]; if(/^<\//.test(m[1])) open.pop(); else open.push(m[1].match(/^<(\w+)/)[1]); }
    else{ out+=m[2]; cnt++; }
  }
  return out+open.reverse().map(t=>'</'+t+'>').join('');
}

/* 캐릭터 목소리: 파일 없이 브라우저에서 합성하는 '삐뽀삐뽀' 대사음
   글자 코드로 음높이를 정해서 같은 문장은 늘 같은 억양으로 들립니다 */
const VOICES={
  jack:  {type:'square',  lo:330,hi:520, dur:.06, gain:.035, lp:1800},           // 통통 튀는 호박
  pipi:  {type:'sine',    lo:950,hi:1500,dur:.045,gain:.09,  slide:1.35},        // 삐익! 높은 박쥐
  lucian:{type:'triangle',lo:110,hi:165, dur:.11, gain:.16,  lp:900},            // 낮고 느린 백작
  boo:   {type:'sine',    lo:300,hi:420, dur:.12, gain:.08,  vib:9},             // 떨리는 유령
  hazel: {type:'triangle',lo:520,hi:820, dur:.055,gain:.09,  slide:.85}          // 장난스러운 마녀
};
const Voice={
  ctx:null, on:LS.get(K('voice'),true),
  init(){
    try{
      if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx=new AC(); }
      if(this.ctx.state==='suspended') this.ctx.resume();
    }catch(e){}
  },
  blip(key,code){
    const v=VOICES[key], ctx=this.ctx; if(!this.on||!v||!ctx||ctx.state!=='running') return;
    const t=ctx.currentTime, f=v.lo+(code*7919%97)/97*(v.hi-v.lo);
    const o=ctx.createOscillator(), g=ctx.createGain(); let out=o;
    o.type=v.type; o.frequency.setValueAtTime(f,t);
    if(v.slide) o.frequency.exponentialRampToValueAtTime(f*v.slide,t+v.dur);
    if(v.vib){ const l=ctx.createOscillator(), lg=ctx.createGain(); l.frequency.value=v.vib; lg.gain.value=f*.04; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+v.dur+.02); }
    if(v.lp){ const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=v.lp; o.connect(fl); out=fl; }
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v.gain,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+v.dur);
    out.connect(g).connect(ctx.destination); o.start(t); o.stop(t+v.dur+.02);
  }
};

   🍬 사탕: 내 닉네임이 보이게 감. 받은 사람이 돌려주면(서로 주고받으면) 둘만의 밀담방이 열림
   🦇 편지: 익명. 도착하는 순간 받는 사람은 보낸 이의 인스타를, 보낸 사람은 받는 이의 인스타를 보게 됨 */
const LETTERS=['🦇 코스튬 진짜 찰떡이에요','🦇 아까부터 눈이 자꾸 가요','🦇 웃는 모습이 예뻐요','🦇 대화 한번 해보고 싶어요','🦇 같이 사진 찍어요!','🦇 2차도 가시나요?','🦇 오늘 분위기 최고예요','🦇 타로 결과 궁금해요'];
const candyMap=()=>Store.get('candy')||{};
const candyAt=v=>typeof v==='number'?v:(v&&v.at)||0;
function candySent(a,b){ const c=candyMap(); return !!(c[a]&&c[a][b]); }
function candyFrom(id){ return Object.keys(candyMap()[id]||{}); }                                  // id가 사탕을 준 사람들
function candyTo(id){ const c=candyMap(); return Object.keys(c).filter(f=>c[f]&&c[f][id]).sort((a,b)=>candyAt(c[b][id])-candyAt(c[a][id])); } // id에게 사탕을 준 사람들
function candyLeft(){ const c=candyMap()[ME]||{}; return CONFIG.CANDY_MAX-Object.values(c).filter(v=>!(v&&v.back)).length; }
async function sendCandy(id){
  if(candySent(ME,id)) return;
  const back=candySent(id,ME);
  if(!back&&candyLeft()<=0){ toast('사탕을 모두 썼어요. 받은 사탕에 돌려주는 건 언제든 가능해요'); return; }
  await Store.put('candy/'+ME+'/'+id,{at:Date.now(),back});
  pipiFly();
  if(back){ toast('💬 '+nick(id)+'님과 둘만의 밀담방이 열렸어요!'); confetti(['🍬','💬','✨'],24); }
  else toast('🍬 '+nick(id)+'님에게 사탕을 건넸어요 · 내 닉네임이 보여요');
}
function lettersTo(id){ const L=Store.get('letters')||{}; return Object.keys(L).filter(f=>L[f]&&L[f][id]).map(f=>Object.assign({from:f},L[f][id])).sort((a,b)=>b.at-a.at); }
function lettersFrom(id){ return Object.keys((Store.get('letters')||{})[id]||{}); }
const instaLink=id=>{ const i=prof(id).insta; return i?'<a class="ig" href="https://instagram.com/'+encodeURIComponent(i)+'" target="_blank" rel="noopener">@'+esc(i)+'</a>':'<span class="ig none">인스타 미등록</span>'; };
const pairKey=(a,b)=>[a,b].sort().join('_');
function chatOpen(id){ return (candySent(ME,id)&&candySent(id,ME))||(mphase()==='reveal'&&myMatches().includes(id)); }
function chatPartners(){ const set=new Set(candyFrom(ME).filter(id=>candySent(id,ME))); if(mphase()==='reveal') myMatches().forEach(id=>set.add(id)); return [...set]; }
function msgs(id){ const m=Store.get('chats/'+pairKey(ME,id))||{}; return Object.values(m).filter(x=>x&&x.at).sort((a,b)=>a.at-b.at); }
function unread(id){ if(TAB==='chat'&&CHAT===id&&!document.hidden) return 0; const r=LS.get(K('read:'+ME+':'+id),0); return msgs(id).filter(x=>x.f!==ME&&x.at>r).length; }
function markRead(id){ const m=msgs(id); LS.set(K('read:'+ME+':'+id),m.length?m[m.length-1].at:Date.now()); }
let inboxSeen=null;
function checkInbox(first){
  const cs=candyTo(ME), ls=lettersTo(ME).length, ps=chatPartners(), un=ps.reduce((n,id)=>n+unread(id),0);
  if(!first&&inboxSeen){
    const newC=cs.filter(x=>!inboxSeen.cs.includes(x));
    if(ps.length>inboxSeen.pc){ pipiFly(); toast('💬 둘만의 밀담방이 열렸어요! 밀담 탭을 확인하세요'); }
    else if(newC.length){ pipiFly(); toast('🍬 '+nick(newC[0])+'님이 사탕을 보냈어요! 돌려주면 둘만의 방이 열려요'); }
    else if(ls>inboxSeen.ls){ pipiFly(); toast('🦇 익명의 편지가 도착했어요! 보낸 이의 인스타가 함께 왔어요'); }
    else if(un>inboxSeen.un){ const id=ps.find(x=>unread(x)>0); if(id) toast('💬 '+nick(id)+' · '+String((msgs(id).slice(-1)[0]||{}).x||'').slice(0,30)); }
  }
  inboxSeen={cs,ls,pc:ps.length,un};
}

const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];

const fmt=s=>{ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function tstate(){
  const T=Store.get('timer');
  if(!T||!T.kind||T.kind==='idle') return {kind:'idle',r:T&&T.r||0,ph:'idle'};
  const el=((T.paused||Date.now())-T.start)/1000, P=!!T.paused;
  if(T.kind==='round'){
    const talk=T.talk+(T.addT||0), mv=T.r>=ROUNDS.length?0:T.move+(T.addM||0);
    if(el<talk) return {kind:'round',r:T.r,ph:'talk',rem:talk-el,tot:talk,paused:P};
    if(el<talk+mv) return {kind:'round',r:T.r,ph:'move',rem:talk+mv-el,tot:mv,paused:P};
    return {kind:'round',r:T.r,ph:'wait',rem:0,tot:1,paused:P};
  }
  if(T.kind==='break'){ const d=T.dur+(T.addT||0); return {kind:'break',r:T.r,ph:el<d?'break':'wait',rem:Math.max(0,d-el),tot:d,paused:P}; }

}
function clockLabel(t){
  if(t.kind==='idle') return ['THE MIDNIGHT CLOCK','곧 첫 번째 종이 울립니다'];
  if(t.kind==='free') return ['FREE TIME','자유 네트워킹 · 기억해둔 영혼을 찾아가세요'];
  if(t.kind==='break') return ['INTERMISSION',t.ph==='wait'?'곧 다음 라운드가 시작돼요':'숨 고르기 · 물 한 잔, 빙고 체크'];
  if(t.ph==='talk') return ['ROUND '+roman(t.r),'대화 중 · '+ROUNDS[t.r-1].n];
  if(t.ph==='move') return ['ROUND '+roman(t.r),'다음 테이블로 이동해 주세요'];
  return ['ROUND '+roman(t.r),t.r>=ROUNDS.length?'모든 라운드가 끝났어요':'다음 라운드를 기다리는 중'];

function bindAdminRound(){

  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ admR+= +b.dataset.rs; renderAdmin(); });
  $('rStart').onclick=()=>{ const r=admR; admR=Math.min(ROUNDS.length,r+1); save({kind:'round',r,start:Date.now(),talk:talk(),move:move(),addT:0,addM:0,paused:null}); };
  $('rBreak').onclick=()=>{ const r=(T().r||0); save({kind:'break',r,start:Date.now(),dur:180,addT:0,paused:null}); };
  $('rFree').onclick=()=>{ if(confirm('자유 시간으로 넘어갈까요?')) save({kind:'free',r:ROUNDS.length,start:Date.now()}); };
  $('rIdle').onclick=()=>{ if(confirm('시계를 대기 화면으로 돌릴까요?')) save({kind:'idle',r:0}); };

  const adj=d=>{ const t=T(), s=tstate(); if(!t.start) return;
    if(s.ph==='move') t.addM=(t.addM||0)+d; else t.addT=(t.addT||0)+d;
    if(d<0){ const s2=(Store.data.timer=t,tstate()); if(s2.kind!==s.kind||s2.ph!==s.ph){ if(s.ph==='move') t.addM-=d; else t.addT-=d; } }
    save(t); };
  $('rPlus').onclick=()=>adj(60); $('rMinus').onclick=()=>adj(-60);
  $('rSkip').onclick=()=>{ const t=T(), s=tstate(); if(!t.start||s.ph==='wait'||s.kind==='free') return;
    const el=((t.paused||Date.now())-t.start)/1000;

function parseRoster(text){
  const out=[], bad=[];
  text.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach((line,i)=>{
    const parts=line.split(/[\s,\t\/]+/).filter(Boolean);
    const gi=parts.findIndex(x=>/^(남|여|남자|여자|m|f|M|F)$/.test(x));
    const bi=parts.findIndex(x=>/^\d{6}$|^\d{8}$|^\d{4}[.\-]\d{1,2}[.\-]\d{1,2}$/.test(x));
    if(gi<0||bi<0){ bad.push(line); return; }
    let b=parts[bi]; if(/[.\-]/.test(b)){ const [y,m,d]=b.split(/[.\-]/); b=y+m.padStart(2,'0')+d.padStart(2,'0'); }
    const name=parts.filter((_,k)=>k!==gi&&k!==bi).join('');
    const g=/^(남|남자|m|M)$/.test(parts[gi])?'m':'f';
    out.push({id:'p'+String(out.length+1).padStart(2,'0'),g,h:credHash(name,b)});
  });
  if(bad.length){ $('rMsg').textContent='형식 확인 필요: '+bad.join(' / '); if(!out.length) return null; }
  return out;
}
function copy(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어요'),()=>{ prompt('복사해서 쓰세요',t); }); }
let wf='all', wAng=0;
function wheelPool(){
  let s=souls(); if(wf==='m'||wf==='f') s=s.filter(p=>p.g===wf);
  if(wf==='none'){ const used=new Set(matchResults().flat()); s=s.filter(p=>!used.has(p.id)); }
  return s.map(p=>p.id);
}
function drawWheel(a){
  const cv=$('wheel'); if(!cv) return; const x=cv.getContext('2d'), ids=wheelPool(), n=ids.length, R=290;
  x.clearRect(0,0,600,600); x.save(); x.translate(300,300); x.rotate(a);
  const cols=['#8a0f1c','#1a1f6b','#3a1e10','#4b2a6a','#0f2d4a','#c2421c'];
  if(!n){ x.fillStyle='#222'; x.beginPath(); x.arc(0,0,R,0,7); x.fill(); }
  ids.forEach((id,i)=>{ const s=i/n*Math.PI*2, e=(i+1)/n*Math.PI*2;
    x.fillStyle=cols[i%cols.length]; x.beginPath(); x.moveTo(0,0); x.arc(0,0,R,s,e); x.fill();
    x.save(); x.rotate((s+e)/2); x.fillStyle='#fff'; x.font=(n>24?18:26)+'px Hahmlet, serif'; x.textAlign='right'; x.textBaseline='middle'; x.fillText(nick(id).slice(0,8),R-18,0); x.restore(); });
  x.restore(); x.fillStyle='#ffcf7a'; x.beginPath(); x.arc(300,300,26,0,7); x.fill();
}
function spinWheel(){
  const ids=wheelPool(); if(!ids.length||wheelSpinning) return; wheelSpinning=true;
  const win=rnd(ids.length), n=ids.length;
  const target=Math.PI*2*6 + (Math.PI*1.5 - (win+.5)/n*Math.PI*2) - (wAng%(Math.PI*2));
  const start=wAng, t0=performance.now(), dur=4800;
  (function f(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4); wAng=start+target*e; drawWheel(wAng);
    if(k<1) requestAnimationFrame(f); else { wheelSpinning=false; $('wres').innerHTML='🎉 <b style="color:var(--gold);font-size:20px">'+esc(avat(ids[win])+' '+nick(ids[win]))+'</b>'; confetti(['🎉','🎃','✨'],30); } })(t0);
}
function splitTables(k){
  const m=shuffle(souls().filter(p=>p.g==='m').map(p=>p.id)), f=shuffle(souls().filter(p=>p.g==='f').map(p=>p.id));
  const T=Array.from({length:k},()=>[]); m.forEach((id,i)=>T[i%k].push(id)); f.forEach((id,i)=>T[(k-1-i%k)].push(id));
  $('tOut').innerHTML='<div class="grid">'+T.map((t,i)=>'<div class="panel" style="margin:0;padding:12px"><h3 style="font-size:16px">🕯️ 테이블 '+(i+1)+'</h3><div style="font-size:13px;line-height:1.8">'+t.map(id=>esc(avat(id)+' '+nick(id))).join('<br>')+'</div></div>').join('')+'</div>';
}
