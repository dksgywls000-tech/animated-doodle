<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0605">
<title>솔로 할로윈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Yeseva+One&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --night:#0b0605; --wood:#1a0f0a; --wood2:#24150d; --glass:rgba(24,12,8,.78);
    --amber:#f2a541; --gold:#ffcf7a; --blood:#b3121f; --blood-d:#6e0a12; --wine:#8a1420;
    --bone:#fff6ea; --muted:rgba(255,236,214,.64); --faint:rgba(255,236,214,.16);
    --teal:#3fb8a8; --pump:#f07a1a; --violet:#7b4fb0;
    --kr:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    --round:"Jua","Pretendard Variable",sans-serif;
    --heavy:"Black Han Sans","Jua",sans-serif;
    --serif:"Yeseva One",Georgia,serif;
    --script:"Yellowtail",cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--night);color:var(--bone);font-family:var(--kr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;color:inherit}
  input,textarea{font-family:var(--kr)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ── 배경: 성당 스테인드글라스 ── */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(60% 34% at 28% 22%,rgba(242,165,65,.42),transparent 70%),
      radial-gradient(50% 30% at 76% 20%,rgba(179,18,31,.32),transparent 70%),
      linear-gradient(180deg,#2a1408 0%,#140a06 48%,#0b0605 100%)}
  #bg .photo{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1.2s}
  #bg .photo.ok{opacity:.9}
  #bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,6,5,.15) 0%,rgba(11,6,5,.35) 40%,rgba(11,6,5,.88) 100%)}
  #bg .ray{position:absolute;top:-10%;left:20%;width:46%;height:130%;transform:rotate(-24deg);
    background:linear-gradient(90deg,transparent,rgba(255,200,110,.14),transparent);filter:blur(8px);animation:ray 9s ease-in-out infinite}
  #bg .ray.r2{left:50%;width:22%;animation-delay:-4s;opacity:.7}
  @keyframes ray{0%,100%{opacity:.45}50%{opacity:1}}
  .dust{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,215,150,.75);box-shadow:0 0 6px rgba(255,200,120,.8);animation:dust linear infinite}
  @keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(40px,-60vh);opacity:0}}

  .screen{position:relative;z-index:1;min-height:100%;min-height:100dvh}

  /* ── 포스터 타이포 ── */
  .poster{font-family:var(--heavy);color:#fff;-webkit-text-stroke:3px var(--blood);paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,190,110,.25);letter-spacing:-.02em}
  .script{font-family:var(--script);color:#fff;-webkit-text-stroke:1.5px var(--blood);paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  .redtxt{font-family:var(--round);color:#ff3b46;-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .whitetxt{font-family:var(--round);color:#fff;-webkit-text-stroke:3px var(--blood-d);paint-order:stroke fill}
  .serif{font-family:var(--serif)}

  /* ── 로그인 ── */
  #login{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
  .lg-top{font-family:var(--round);font-size:14px;color:#ffd7d7;-webkit-text-stroke:0;margin:0 0 6px;letter-spacing:.02em}
  .lg-top b{color:#ff4f59}
  .lg-title{font-size:clamp(64px,24vw,118px);line-height:.92;margin:4px 0 0}
  .lg-title span{display:block}
  .lg-quote{font-family:var(--round);font-size:clamp(15px,4.6vw,20px);margin:14px 0 26px;color:#fff;-webkit-text-stroke:2.5px var(--blood-d);paint-order:stroke fill}
  .lg-quote em{font-style:normal;color:var(--teal);-webkit-text-stroke:2.5px #fff}
  .card{width:100%;max-width:400px;background:var(--glass);border:1px solid rgba(255,207,122,.28);border-radius:20px;padding:20px 18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,160,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .fld{display:block;text-align:left;margin-bottom:12px}
  .fld>span{display:block;font-size:12.5px;font-weight:700;color:var(--gold);margin-bottom:6px;letter-spacing:.02em}
  .fld>span i{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
  .inp{width:100%;min-height:50px;border-radius:12px;border:1px solid rgba(255,207,122,.3);background:rgba(10,5,4,.7);color:var(--bone);padding:12px 14px;font-size:16px}
  .inp::placeholder{color:rgba(255,236,214,.3)}
  .inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,165,65,.18)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;cursor:pointer;
    background:linear-gradient(180deg,#d0202e,#8a0f19);color:#fff;font-family:var(--round);font-size:18px;letter-spacing:.02em;
    box-shadow:0 6px 0 #4a060c,0 10px 24px rgba(179,18,31,.45);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4a060c,0 4px 12px rgba(179,18,31,.4)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.gold{background:linear-gradient(180deg,#ffcf7a,#e09330);color:#3a1600;box-shadow:0 6px 0 #7a4210,0 10px 24px rgba(242,165,65,.35)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,207,122,.35);box-shadow:none;color:var(--bone);font-family:var(--kr);font-size:15px;font-weight:700}
  .btn.small{min-height:42px;font-size:15px;border-radius:11px}
  .err{min-height:20px;margin:10px 0 0;font-size:13px;color:#ff8a8f;line-height:1.5}
  .lg-foot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}

  /* ── 인트로 ── */
  #intro{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden}
  #gate{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;
    background:radial-gradient(40% 30% at 50% 55%,rgba(242,140,40,.22),transparent 70%),#050202}
  #gate p{font-family:var(--round);font-size:18px;color:var(--gold);margin:0;animation:breathe 2.2s ease-in-out infinite}
  #gate small{font-size:12px;color:var(--muted)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  .candle{position:relative;width:46px;height:120px}
  .candle .wax{position:absolute;bottom:0;left:6px;width:34px;height:84px;border-radius:6px 6px 4px 4px;background:linear-gradient(90deg,#e9dcc4,#fff6e6 45%,#cbb994)}
  .candle .wick{position:absolute;bottom:84px;left:22px;width:2px;height:9px;background:#2a1a10}
  .candle .flame{position:absolute;bottom:90px;left:12px;width:22px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 70%,#fff 0 18%,#ffd36b 35%,#ff8a1a 70%,transparent 72%);filter:blur(.4px);
    transform-origin:50% 100%;animation:flame 1.1s ease-in-out infinite alternate;box-shadow:0 0 40px 14px rgba(255,150,40,.35)}
  @keyframes flame{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
  #gate.off .flame{animation:none;opacity:0;transition:opacity .3s}
  #vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;transition:opacity .8s}
  #vid.on{opacity:1}
  #intro .vshade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7));pointer-events:none}
  .ov-line{position:absolute;left:0;right:0;padding:0 22px;text-align:center;font-family:var(--round);opacity:0;pointer-events:none}
  .ov-line.l1{top:22%;font-size:22px;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
  .ov-line.l2{top:30%;font-size:18px;color:#ffd7a0;-webkit-text-stroke:2px #000;paint-order:stroke fill}
  .ov-line.show{animation:lineIn 2.4s ease forwards}
  @keyframes lineIn{0%{opacity:0;filter:blur(8px);transform:translateY(10px) scale(.98)}
    18%{opacity:1;filter:blur(0);transform:none}
    22%{opacity:.4}26%{opacity:1}82%{opacity:1}100%{opacity:0;filter:blur(4px)}}
  .ov-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;padding:0 16px}
  .ov-title.show{animation:titleIn 3.2s ease forwards}
  .ov-title .script{font-size:34px;margin-bottom:-4px}
  .ov-title .poster{font-size:clamp(70px,25vw,130px);line-height:.92}
  .ov-title .whitetxt{font-size:clamp(15px,4.4vw,19px);margin-top:16px}
  @keyframes titleIn{0%{opacity:0;transform:scale(1.35);filter:blur(10px)}14%{opacity:1;transform:scale(1);filter:blur(0)}
    16%{transform:translateX(-4px)}18%{transform:translateX(4px)}20%{transform:none}86%{opacity:1}100%{opacity:0;transform:scale(.96)}}
  .glitch{animation:glitch .5s steps(2) 3}
  @keyframes glitch{0%{filter:none}50%{filter:hue-rotate(-30deg) contrast(1.6) brightness(1.3)}100%{filter:none}}
  #skipIntro{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5;min-height:36px;padding:0 14px;border-radius:99px;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .bats-burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bb{position:absolute;width:40px;height:22px;left:50%;top:55%;animation:bb 1.4s cubic-bezier(.2,.7,.3,1) forwards}
  .bb svg{width:100%;height:100%;animation:flap .16s linear infinite alternate}
  @keyframes bb{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(var(--s));opacity:0}}
  @keyframes flap{0%{transform:scaleY(1)}100%{transform:scaleY(.4)}}

  /* ── 비주얼노벨 ── */
  #vn{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow:hidden}
  #vn .vnbg{position:absolute;inset:0;background:rgba(5,2,2,.35)}
  #vnStage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;min-height:0}
  #vnStage .spot{position:absolute;bottom:-40px;left:50%;width:280px;height:80px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,190,100,.38),transparent 70%);filter:blur(4px)}
  .ch{position:relative;width:min(62vw,260px);height:min(62vw,260px);will-change:transform}
  .ch svg{width:100%;height:100%;overflow:visible;display:block}
  #vnBox{position:relative;margin:0 12px calc(12px + env(safe-area-inset-bottom));min-height:190px;background:linear-gradient(180deg,rgba(28,12,8,.94),rgba(14,6,4,.97));
    border:2px solid #7a4a1e;border-radius:18px;padding:30px 18px 18px;box-shadow:0 0 0 4px rgba(0,0,0,.5),0 -10px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(255,170,60,.06);cursor:pointer}
  #vnBox::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,207,122,.18);border-radius:13px;pointer-events:none}
  #vnName{position:absolute;top:-18px;left:16px;padding:6px 16px 7px;border-radius:10px;font-family:var(--round);font-size:16px;color:#fff;
    background:var(--blood);border:2px solid #ffcf7a;box-shadow:0 4px 0 rgba(0,0,0,.4);transform:rotate(-2deg)}
  #vnText{font-family:var(--round);font-size:clamp(17px,4.8vw,20px);line-height:1.6;color:#fff6ea;min-height:64px;word-break:keep-all}
  #vnText b{color:var(--gold);font-weight:400}
  #vnText em{font-style:normal;color:#ff6b74}
  #vnNext{position:absolute;right:16px;bottom:10px;color:var(--gold);font-size:14px;animation:nextb .8s ease-in-out infinite alternate}
  @keyframes nextb{0%{transform:translateY(0)}100%{transform:translateY(5px)}}
  #vnSkip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;min-height:34px;padding:0 13px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
  #vnProg{position:absolute;top:calc(27px + env(safe-area-inset-top));left:14px;right:120px;z-index:3;display:flex;gap:3px}
  #vnProg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
  #vnProg i.on{background:var(--gold)}
  .vnform{cursor:default}
  .vnform .fld{margin-bottom:10px}
  .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .av{aspect-ratio:1;border-radius:14px;border:2px solid rgba(255,207,122,.18);background:rgba(255,255,255,.05);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .av[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,165,65,.2);transform:scale(1.07)}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin:4px 0 10px}

  /* ── 캐릭터 공통 애니메이션 ── */
  .ch .inner{width:100%;height:100%;transform-origin:50% 100%}
  .enter-drop .inner{animation:dropIn .9s cubic-bezier(.3,.7,.4,1) both}
  @keyframes dropIn{0%{transform:translateY(-110vh) scale(.9,1.1)}55%{transform:translateY(0) scale(1.18,.78)}70%{transform:translateY(-22px) scale(.94,1.08)}85%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
  .enter-flutter .inner{animation:flutterIn 1.1s ease-out both}
  @keyframes flutterIn{0%{transform:translate(70vw,-40vh) scale(.4)}25%{transform:translate(30vw,-10vh) scale(.6) rotate(10deg)}50%{transform:translate(-14vw,-26vh) scale(.8) rotate(-12deg)}75%{transform:translate(8vw,-4vh) scale(.95) rotate(6deg)}100%{transform:none}}
  .enter-swirl .inner{animation:swirlIn 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes swirlIn{0%{transform:perspective(600px) rotateY(90deg) scale(.3);filter:brightness(0) blur(6px);opacity:0}40%{opacity:1;filter:brightness(.2) blur(2px)}70%{transform:perspective(600px) rotateY(-14deg) scale(1.04);filter:none}100%{transform:none}}
  .enter-fade .inner{animation:ghostIn 1.5s ease-out both}
  @keyframes ghostIn{0%{opacity:0;transform:translateY(40px) scale(.85);filter:blur(10px)}40%{opacity:.4}60%{opacity:.15}80%{opacity:.9;filter:blur(0)}100%{opacity:1;transform:none}}
  .enter-fly .inner{animation:flyIn 1.2s cubic-bezier(.25,.7,.3,1) both}
  @keyframes flyIn{0%{transform:translate(-90vw,-50vh) rotate(-28deg) scale(.6)}60%{transform:translate(6vw,4vh) rotate(8deg) scale(1.02)}100%{transform:none}}
  .exit .inner{animation:chOut .35s ease-in both}
  @keyframes chOut{to{opacity:0;transform:translateY(30px) scale(.8)}}
  .ch .idle{width:100%;height:100%}
  /* 잭: 통통 튀는 바운스 */
  .ch-jack .idle{transform-origin:50% 100%;animation:jackIdle 1.4s ease-in-out infinite}
  @keyframes jackIdle{0%,100%{transform:scale(1,1)}45%{transform:translateY(-10px) scale(.97,1.04)}55%{transform:translateY(-10px) scale(.97,1.04)}90%{transform:scale(1.05,.95)}}
  .ch-jack .lit{animation:litFlick 2.6s infinite}
  @keyframes litFlick{0%,100%{fill:#ffd25e}40%{fill:#ffbc3a}42%{fill:#fff0a0}44%{fill:#ffc94a}}
  .ch-jack .hat{transform-box:fill-box;transform-origin:50% 100%;animation:hatTip 2.8s ease-in-out infinite}
  @keyframes hatTip{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
  /* 부: 둥실 + 좌우 흔들 */
  .ch-boo .idle{animation:booFloat 3.2s ease-in-out infinite}
  @keyframes booFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
  .ch-boo .tail{transform-box:fill-box;transform-origin:50% 0;animation:tail 1.2s ease-in-out infinite alternate}
  @keyframes tail{0%{transform:skewX(-6deg)}100%{transform:skewX(6deg)}}
  .ch-boo.shy .hands{transform:translateY(-34px)}
  .ch-boo .hands{transition:transform .4s}
  /* 피피: 날갯짓 */
  .ch-pipi .idle{animation:pipiHover 1.1s ease-in-out infinite}
  @keyframes pipiHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .ch-pipi .wl,.ch-pipi .wr{transform-box:view-box;animation:wing .22s ease-in-out infinite alternate}
  .ch-pipi .wl{transform-origin:84px 92px}
  .ch-pipi .wr{transform-origin:116px 92px;animation-name:wingR}
  @keyframes wing{0%{transform:rotate(18deg) scaleY(.7)}100%{transform:rotate(-14deg)}}
  @keyframes wingR{0%{transform:rotate(-18deg) scaleY(.7)}100%{transform:rotate(14deg)}}
  /* 루시안: 망토 펄럭 */
  .ch-lucian .idle{animation:lucIdle 4s ease-in-out infinite}
  @keyframes lucIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .ch-lucian .cape{transform-box:fill-box;transform-origin:50% 0;animation:cape 3s ease-in-out infinite}
  @keyframes cape{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(-3deg) scaleX(1.03)}}
  .ch-lucian .brow{transition:transform .2s}
  .ch-lucian.talking .brow.r{transform:translateY(-4px)}
  /* 헤이즐: 빗자루 호버 */
  .ch-hazel .idle{animation:hazIdle 2.4s ease-in-out infinite}
  @keyframes hazIdle{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  .ch-hazel .spark{animation:spark 1.4s ease-out infinite}
  .ch-hazel .spark:nth-child(2){animation-delay:.45s}.ch-hazel .spark:nth-child(3){animation-delay:.9s}
  @keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-30px,14px) scale(1.2)}}
  /* 말할 때 입 */
  .mouth{transform-box:fill-box;transform-origin:50% 30%}
  .talking .mouth{animation:talk .16s ease-in-out infinite alternate}
  @keyframes talk{0%{transform:scaleY(.45)}100%{transform:scaleY(1.1)}}
  .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  /* ── 앱 ── */
  #app{padding:0 0 calc(86px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(180deg,rgba(11,6,5,.94) 70%,rgba(11,6,5,0))}
  .brand{display:flex;align-items:baseline;gap:6px;cursor:pointer;user-select:none}
  .brand .script{font-size:22px}
  .brand .poster{font-size:21px;-webkit-text-stroke:2px var(--blood)}
  .me-chip{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 12px 0 5px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--faint);font-size:13px;font-weight:700;cursor:pointer;max-width:52%}
  .me-chip .e{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(242,165,65,.18);font-size:16px;flex:0 0 28px}
  .me-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab-h{margin:8px 0 14px}
  .tab-h .script{font-size:26px;display:block;text-align:center}
  .tab-h h2{margin:0;text-align:center;font-family:var(--round);font-weight:400;font-size:clamp(28px,8.4vw,36px);color:#fff;-webkit-text-stroke:3px var(--blood);paint-order:stroke fill}

function playIntro(){
  show('intro');
  const v=$('vid'), gate=$('gate');
  gate.hidden=false; gate.classList.remove('off'); v.classList.remove('on');
  let done=false;
  const finish=()=>{ if(done) return; done=true; try{v.pause();}catch(e){} $('skipIntro').hidden=true;
    $('intro').animate([{opacity:1},{opacity:0}],{duration:600}).onfinish=()=>{ $('intro').hidden=true; startVN(); }; };
  $('skipIntro').onclick=finish;
  gate.onclick=async()=>{
    gate.onclick=null; gate.classList.add('off'); await sleep(350); gate.hidden=true; $('skipIntro').hidden=false;
    let ok=false;
    if(CONFIG.INTRO_VIDEO&&!/REPLACE/.test(CONFIG.INTRO_VIDEO)){
      v.src=CONFIG.INTRO_VIDEO; v.muted=false;
      try{ await v.play(); ok=true; v.classList.add('on'); }catch(e){ try{ v.muted=true; await v.play(); ok=true; v.classList.add('on'); }catch(_){ } }
    }
    const lines=[[300,'l1','쉿… 방금, 문이 열렸어.'],[2500,'l2','혼자 온 영혼의 냄새가 나는데?'],[4700,'l1','오늘 밤은 아무도 혼자 돌아가지 않아.']];
    lines.forEach(([t,c,txt])=>setTimeout(()=>{ if(done) return; const el=$('o'+c); el.textContent=txt; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); },t));
    setTimeout(()=>{ if(!done) batBurst(); },3800);
    const titleAt=ok&&v.duration?Math.max(5600,(v.duration-3)*1000):6200;
    setTimeout(()=>{ if(done) return; const t=$('otitle'); t.classList.add('show'); $('intro').classList.add('glitch'); setTimeout(()=>$('intro').classList.remove('glitch'),1600); },titleAt);
    setTimeout(finish,titleAt+3300);
  };
}

function vnType(html){
  const box=$('vnText'); vnFull=html; $('vnNext').hidden=true;
  const tmp=document.createElement('div'); tmp.innerHTML=html; const plain=tmp.textContent;
  let i=0; vnCur&&vnCur.el.classList.add('talking');
  clearInterval(vnTyping);
  vnTyping=setInterval(()=>{
    i++;
    // 태그를 깨지 않도록: 원문 HTML에서 i글자까지만 보이게 잘라냄
    box.innerHTML=sliceHTML(html,i);
    if(i>=plain.length){ vnDoneType(); }
  },32);
}
function vnDoneType(){ clearInterval(vnTyping); vnTyping=null; $('vnText').innerHTML=vnFull; $('vnNext').hidden=false; vnCur&&vnCur.el.classList.remove('talking'); }
function sliceHTML(html,n){
  let out='',cnt=0,open=[];
  const re=/(<[^>]+>)|([^<])/g; let m;
  while((m=re.exec(html))&&cnt<n){
    if(m[1]){ out+=m[1]; if(/^<\//.test(m[1])) open.pop(); else open.push(m[1].match(/^<(\w+)/)[1]); }
    else{ out+=m[2]; cnt++; }
  }
  return out+open.reverse().map(t=>'</'+t+'>').join('');
}
function vnAdvance(){
  if(SCRIPT[vnI]&&SCRIPT[vnI].form) return;
  if(vnTyping){ vnDoneType(); return; }
  vnI++; vnStep();
}

function voteResults(){
  const snap=Store.get('results/vote'); if(snap) return snap;
  return computeVotes();
}
function computeVotes(){
  const V=Store.get('votes')||{}, out={m:[],f:[]};
  ['m','f'].forEach(g=>{
    const t={}; Object.values(V).forEach(x=>{ if(x&&x[g]) t[x[g]]=(t[x[g]]||0)+1; });
    out[g]=Object.entries(t).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([id,n])=>({id,n}));
  });
  return out;
}
function podium(list){
  const top=[list[1],list[0],list[2]];
  return '<div class="podium">'+top.map((x,i)=>{ const cls=['p2','p1','p3'][i];
    if(!x) return '<div class="pod '+cls+'"><div class="blk">-</div></div>';
    return '<div class="pod '+cls+'">'+(cls==='p1'?'<span class="crown">👑</span>':'')+'<div class="e">'+esc(avat(x.id))+'</div><div class="n">'+esc(nick(x.id))+'</div><div class="blk">'+(cls==='p1'?1:cls==='p2'?2:3)+'</div><div class="votes">'+x.n+'표</div></div>'; }).join('')+'</div>';
}

function matchResults(){ return Store.get('results/match')||computeMatches(); }
function computeMatches(){
  const P=Store.get('picks')||{}, pairs=[];
  Object.keys(P).forEach(a=>{ (P[a]||[]).forEach((b,ia)=>{
    if(a<b&&Array.isArray(P[b])){ const ib=P[b].indexOf(a); if(ib>=0&&gOf(a)!==gOf(b)) pairs.push({a,b,s:ia+ib,t:Math.min(ia,ib)}); } }); });
  pairs.sort((x,y)=>x.s-y.s||x.t-y.t||(x.a+x.b).localeCompare(y.a+y.b));
  const used=new Set(), out=[];
  pairs.forEach(p=>{ if(!used.has(p.a)&&!used.has(p.b)){ used.add(p.a); used.add(p.b); out.push([p.a,p.b]); } });
  return out;
}

    if(step>=QUIZ.length){
      const type=done(), m=MONSTER[type];
      saveProfile({type}).then(()=>paintMe());
      v.innerHTML=backBtn+head('Halloween','몬스터 연애유형','Monster Type')+guide('hazel','나왔다! 너는…')+
        '<div class="panel" style="text-align:center"><div style="font-size:84px;animation:dropIn .9s both">'+m.e+'</div><div class="redtxt" style="font-size:32px">'+m.n+'</div><p class="muted" style="margin-top:8px">'+m.d+'</p>'+
        '<p class="muted" style="margin-top:10px;font-size:12px">명찰과 도감에 배지로 표시돼요. 같은 유형을 찾아보세요!</p></div><div class="btnrow"><button class="btn ghost small" id="qAgain">다시 하기</button></div>';
      mountGuides(v); $('rback').onclick=()=>go('rooms'); $('qAgain').onclick=()=>roomQuiz(v); confetti([m.e,'✨'],20); return;
    }
    const q=QUIZ[step];
    v.innerHTML=backBtn+head('Halloween','몬스터 연애유형','Monster Type')+
      guide('hazel',p.type&&step===0?'이미 <b>'+MONSTER[p.type].n+'</b>이지만… 다시 해볼래?':'솔직하게 골라! 정답은 없어~')+
      '<div class="panel"><div class="qbar"><i style="width:'+(step/QUIZ.length*100)+'%"></i></div><h3>Q'+(step+1)+'. '+q[0]+'</h3><div class="quiz-opt">'+q[1].map((o,i)=>'<button data-i="'+i+'">'+o[0]+'</button>').join('')+'</div></div>';
    mountGuides(v); $('rback').onclick=()=>go('rooms');
    v.querySelectorAll('.quiz-opt button').forEach(b=>b.onclick=()=>{ ans.push(q[1][+b.dataset.i][1]); step++; paint(); });
  };
  paint();
}

function openSheet(html){ $('sheetIn').innerHTML=html; $('sheet').hidden=false; $('sheetBack').hidden=false; document.body.style.overflow='hidden'; }

let toastT=0;
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; el.style.animation='none'; void el.offsetWidth; el.style.animation=''; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2400); }
function pipiFly(){ const f=document.createElement('div'); f.className='flyby'; f.appendChild(charEl('pipi')); document.body.appendChild(f); setTimeout(()=>f.remove(),2700); }
function confetti(chars,n){
  const box=document.createElement('div'); box.className='confetti';
  for(let i=0;i<n;i++){ const s=document.createElement('i'); s.textContent=chars[i%chars.length];
    s.style.cssText='left:'+rnd(100)+'%;font-size:'+(16+rnd(18))+'px;animation-duration:'+(2.2+Math.random()*2)+'s;animation-delay:'+(Math.random()*.8)+'s';
    box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5200);
}

function admTick(){ if(!$('admin').hidden){ const a=document.activeElement; if(a&&a.closest&&a.closest('#admin')&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')) return; if(wheelSpinning) return; renderAdmin(); } }
function closeAdmin(){ $('admin').hidden=true; document.body.style.overflow=''; Store.listeners=Store.listeners.filter(f=>f!==admTick); if(location.hash==='#admin') history.replaceState(null,'',location.pathname); if(!ME) show('login'); }
const PH={wait:'대기',open:'열림',closed:'마감',reveal:'발표'};

  $('admIn').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>🧛 운영진 저택</h2><button class="btn ghost small" style="width:auto;padding:0 16px" id="admClose">닫기</button></div>'+
    (Store.remote?'':'<div class="panel" style="border-color:var(--amber)"><h3>⚠️ 로컬 데모 모드</h3><p class="muted">DB_URL이 비어 있어 이 기기에만 저장돼요. 실제 행사에선 README대로 Firebase 주소를 넣어주세요.</p></div>')+
    '<div class="panel"><h3>현황 <small>5초마다 갱신</small></h3><div class="stats"><div class="stat"><b>'+S.length+'/'+R.length+'</b><span>입장</span></div><div class="stat"><b>'+Object.keys(V).length+'</b><span>투표</span></div><div class="stat"><b>'+Object.keys(P).length+'</b><span>실 제출</span></div></div></div>'+
    '<div class="panel"><h3>👑 베스트 드레서 <small>현재 '+PH[phase('vote')]+'</small></h3>'+ctrl('vote')+
      '<table style="margin-top:10px"><tr><th>남</th><th></th><th>여</th><th></th></tr>'+[0,1,2,3,4].map(i=>'<tr><td>'+(vr.m[i]?esc(nick(vr.m[i].id)):'')+'</td><td>'+(vr.m[i]?vr.m[i].n:'')+'</td><td>'+(vr.f[i]?esc(nick(vr.f[i].id)):'')+'</td><td>'+(vr.f[i]?vr.f[i].n:'')+'</td></tr>').join('')+'</table>'+
      '<p class="muted" style="font-size:11.5px;margin-top:6px">“발표”를 누르면 그 순간의 집계가 고정되어 모두에게 공개돼요.</p></div>'+
    '<div class="panel"><h3>🩸 운명의 실 <small>현재 '+PH[phase('match')]+'</small></h3>'+ctrl('match')+
      '<p class="muted" style="margin-top:10px">현재 성사 <b style="color:var(--gold)">'+mr.length+'쌍</b> · 미성사 '+(S.length-mr.length*2)+'명</p>'+
      '<table style="margin-top:6px">'+mr.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(avat(m[0]))+' '+esc(nick(m[0]))+'</td><td>❤️</td><td>'+esc(avat(m[1]))+' '+esc(nick(m[1]))+'</td></tr>').join('')+'</table>'+
      '<div class="btnrow"><button class="btn ghost small" id="admCopyM">결과 복사</button></div></div>'+
    '<div class="panel"><h3>🎡 경품 룰렛 <small>입장한 영혼 중 추첨</small></h3><div class="seg"><button data-wf="all" aria-pressed="'+(wf==='all')+'">전체</button><button data-wf="m" aria-pressed="'+(wf==='m')+'">남</button><button data-wf="f" aria-pressed="'+(wf==='f')+'">여</button><button data-wf="none" aria-pressed="'+(wf==='none')+'">미매칭</button></div>'+
      '<div class="wheel-wrap"><span class="pin">🔻</span><canvas id="wheel" width="600" height="600"></canvas></div><button class="btn gold" id="spin">🎡 돌리기</button><p class="muted" id="wres" style="text-align:center;margin-top:8px"></p></div>'+
    '<div class="panel"><h3>🍷 테이블 나누기 <small>남녀 섞어서</small></h3><div class="row2"><input class="inp" id="tN" type="number" min="2" max="20" value="4"><button class="btn small" id="tGo">나누기</button></div><div id="tOut" style="margin-top:10px"></div></div>'+
    '<div class="panel"><h3>📸 인스타 태그 <small>태그 동의한 영혼</small></h3><textarea readonly id="tagList">'+esc(S.filter(p=>prof(p.id).tagok&&prof(p.id).insta).map(p=>'@'+prof(p.id).insta).join(' '))+'</textarea><div class="btnrow"><button class="btn ghost small" id="cpTag">@아이디 복사</button></div></div>'+
    '<div class="panel"><h3>📜 명단 만들기</h3><p class="muted">한 줄에 한 명: <code>이름 생년월일 성별</code> (예: <code>홍길동 950315 남</code>)<br>실명·생년월일은 이 기기에서 해시로만 변환돼요.</p>'+
      '<textarea id="rIn" placeholder="홍길동 950315 남&#10;김영희 19970822 여"></textarea>'+
      '<div class="btnrow"><button class="btn small" id="rGen">변환하기</button><button class="btn gold small" id="rUp" '+(Store.remote?'':'')+'>서버 명단으로 올리기</button></div><textarea id="rOut" readonly style="margin-top:8px;min-height:80px" placeholder="index.html의 ROSTER에 붙여넣을 코드"></textarea><p class="muted" id="rMsg"></p>'+
      '<p class="muted" style="font-size:11.5px">현재 명단: '+R.length+'명 ('+(Store.get('roster')?'서버 명단':'파일 내장 명단')+')</p></div>'+
    '<div class="panel"><h3>🧹 초기화</h3><div class="btnrow"><button class="btn ghost small" id="rsVote">투표 지우기</button><button class="btn ghost small" id="rsPick">실 지우기</button><button class="btn ghost small" id="rsAll">전체 데이터 삭제</button></div></div>';
  $('admClose').onclick=closeAdmin;
  document.querySelectorAll('#admin .ctrl button').forEach(b=>b.onclick=async()=>{

  $('rsVote').onclick=async()=>{ if(confirm('모든 투표를 지울까요?')){ await Store.put('votes',null); await Store.put('results/vote',null); renderAdmin(); } };

  $('rsAll').onclick=async()=>{ if(prompt('정말 전체 삭제하려면 "삭제"라고 입력')==='삭제'){ for(const k of ['profiles','votes','picks','candy','letters','results','state']) await Store.put(k,null); renderAdmin(); } };
}
function parseRoster(text){
  const out=[], bad=[];
  text.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach((line,i)=>{
    const parts=line.split(/[\s,\t\/]+/).filter(Boolean);
    const gi=parts.findIndex(x=>/^(남|여|남자|여자|m|f|M|F)$/.test(x));
    const bi=parts.findIndex(x=>/^\d{6}$|^\d{8}$|^\d{4}[.\-]\d{1,2}[.\-]\d{1,2}$/.test(x));
    if(gi<0||bi<0){ bad.push(line); return; }
    let b=parts[bi]; if(/[.\-]/.test(b)){ const [y,m,d]=b.split(/[.\-]/); b=y+m.padStart(2,'0')+d.padStart(2,'0'); }
    const name=parts.filter((_,k)=>k!==gi&&k!==bi).join('');
    const g=/^(남|남자|m|M)$/.test(parts[gi])?'m':'f';
    out.push({id:'p'+String(out.length+1).padStart(2,'0'),g,h:credHash(name,b)});
  });
  if(bad.length){ $('rMsg').textContent='형식 확인 필요: '+bad.join(' / '); if(!out.length) return null; }
  return out;
}
function copy(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어요'),()=>{ prompt('복사해서 쓰세요',t); }); }
let wf='all', wAng=0;
function wheelPool(){
  let s=souls(); if(wf==='m'||wf==='f') s=s.filter(p=>p.g===wf);
  if(wf==='none'){ const used=new Set(matchResults().flat()); s=s.filter(p=>!used.has(p.id)); }
  return s.map(p=>p.id);
}
function drawWheel(a){
  const cv=$('wheel'); if(!cv) return; const x=cv.getContext('2d'), ids=wheelPool(), n=ids.length, R=290;
  x.clearRect(0,0,600,600); x.save(); x.translate(300,300); x.rotate(a);
  const cols=['#8a0f1c','#1a1f6b','#3a1e10','#4b2a6a','#0f2d4a','#c2421c'];
  if(!n){ x.fillStyle='#222'; x.beginPath(); x.arc(0,0,R,0,7); x.fill(); }
  ids.forEach((id,i)=>{ const s=i/n*Math.PI*2, e=(i+1)/n*Math.PI*2;
    x.fillStyle=cols[i%cols.length]; x.beginPath(); x.moveTo(0,0); x.arc(0,0,R,s,e); x.fill();
    x.save(); x.rotate((s+e)/2); x.fillStyle='#fff'; x.font=(n>24?18:26)+'px Jua, sans-serif'; x.textAlign='right'; x.textBaseline='middle'; x.fillText(nick(id).slice(0,8),R-18,0); x.restore(); });
  x.restore(); x.fillStyle='#ffcf7a'; x.beginPath(); x.arc(300,300,26,0,7); x.fill();
}
function spinWheel(){
  const ids=wheelPool(); if(!ids.length||wheelSpinning) return; wheelSpinning=true;
  const win=rnd(ids.length), n=ids.length;
  const target=Math.PI*2*6 + (Math.PI*1.5 - (win+.5)/n*Math.PI*2) - (wAng%(Math.PI*2));
  const start=wAng, t0=performance.now(), dur=4800;
  (function f(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4); wAng=start+target*e; drawWheel(wAng);
    if(k<1) requestAnimationFrame(f); else { wheelSpinning=false; $('wres').innerHTML='🎉 <b style="color:var(--gold);font-size:20px">'+esc(avat(ids[win])+' '+nick(ids[win]))+'</b>'; confetti(['🎉','🎃','✨'],30); } })(t0);
}
function splitTables(k){
  const m=shuffle(souls().filter(p=>p.g==='m').map(p=>p.id)), f=shuffle(souls().filter(p=>p.g==='f').map(p=>p.id));
  const T=Array.from({length:k},()=>[]); m.forEach((id,i)=>T[i%k].push(id)); f.forEach((id,i)=>T[(k-1-i%k)].push(id));
  $('tOut').innerHTML='<div class="grid">'+T.map((t,i)=>'<div class="panel" style="margin:0;padding:12px"><h3 style="font-size:16px">🕯️ 테이블 '+(i+1)+'</h3><div style="font-size:13px;line-height:1.8">'+t.map(id=>esc(avat(id)+' '+nick(id))).join('<br>')+'</div></div>').join('')+'</div>';
}
